<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kampfzone · Lenkrad-Kamera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #eee; font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  video { flex: 1; width: 100%; min-height: 0; object-fit: cover; background: #000; }
  #bar { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: #15181d; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: 700 16px system-ui, sans-serif; border: 0; border-radius: 10px; padding: 12px 16px; background: #ffcc33; color: #111; }
  button.sec { background: #2b3038; color: #eee; }
  #st { flex: 1 1 100%; font-size: 15px; }
  .ok { color: #7dff7a; } .bad { color: #ff6b5a; }
  #code { font: 700 22px system-ui; letter-spacing: 3px; width: 6.5em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; border: 0; }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline autoplay muted></video>
  <div id="bar">
    <div id="st">Handy <b>quer</b> halten und aufs Lenkrad richten. Dann „Kamera starten“.</div>
    <input id="code" placeholder="CODE" maxlength="6" autocomplete="off">
    <button id="go">📷 Kamera starten</button>
    <button id="flip" class="sec">🔄 Kamera wechseln</button>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Handy als Lenkrad-Kamera für Kampfzone: Bild geht per WebRTC (direkt im WLAN) an den PC, das Spiel setzt es unter das Spielbild
const PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
const $ = id => document.getElementById(id), st = (t, c) => { $('st').className = c || ''; $('st').innerHTML = t; };
const q = new URLSearchParams(location.search); if (q.get('c')) $('code').value = q.get('c').toUpperCase();
let stream = null, facing = 'environment', peer = null, call = null, wake = null;
async function camera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
  $('v').srcObject = stream;
}
function connect() {
  const code = $('code').value.trim().toUpperCase();
  if (!code) { st('Bitte den Code vom PC eingeben', 'bad'); return; }
  if (call) try { call.close(); } catch (e) {}
  const go = () => {
    st('Verbinde mit dem PC …');
    call = peer.call('kz-cam-' + code, stream);
    if (!call) { st('Verbindung fehlgeschlagen – Code richtig?', 'bad'); return; }
    let ok = false;
    call.on('stream', () => {});
    const t = setInterval(() => {
      const pc = call.peerConnection;
      if (pc && (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed')) { ok = true; clearInterval(t); st('✅ Mit dem PC verbunden – das Bild ist jetzt im Spiel. Bildschirm bleibt an.', 'ok'); }
      if (pc && (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected')) { clearInterval(t); st('❌ Verbindung abgebrochen – Handy und PC im selben WLAN? Nochmal „Kamera starten“.', 'bad'); }
    }, 500);
    setTimeout(() => { if (!ok) { clearInterval(t); st('❌ Keine Verbindung – ist am PC das Fenster „Lenkrad-Kamera“ offen und der Code richtig?', 'bad'); } }, 20000);
    call.on('close', () => st('Verbindung beendet – zum Neuverbinden „Kamera starten“ drücken.'));
  };
  if (peer && peer.open) go();
  else { if (peer) try { peer.destroy(); } catch (e) {} peer = new Peer(PEER_OPTS); peer.on('open', go); peer.on('error', e => st('❌ Fehler: ' + (e.type || e.message) + ' – Code richtig? PC-Fenster offen?', 'bad')); }
}
$('go').onclick = async () => {
  try { await camera(); } catch (e) { st('❌ Kamera nicht erlaubt – in den Einstellungen für Safari die Kamera erlauben und neu laden.', 'bad'); return; }
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  connect();
};
$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await camera(); if (call && call.peerConnection) { const s = call.peerConnection.getSenders().find(x => x.track && x.track.kind === 'video'); if (s) s.replaceTrack(stream.getVideoTracks()[0]); } } catch (e) {}
};
</script>
</body>
</html>
