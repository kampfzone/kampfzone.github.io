<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kampfzone · Lenkrad-Kamera</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #eee; font: 16px/1.4 system-ui, -apple-system, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #cv { max-width: 100%; max-height: 100%; }
  #v { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
  #bar { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #15181d; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: 700 15px system-ui, sans-serif; border: 0; border-radius: 10px; padding: 11px 13px; background: #ffcc33; color: #111; }
  button.sec { background: #2b3038; color: #eee; }
  #st { flex: 1 1 100%; font-size: 14px; }
  .ok { color: #7dff7a; } .bad { color: #ff6b5a; }
  #code { font: 700 20px system-ui; letter-spacing: 3px; width: 5.5em; text-transform: uppercase; padding: 8px 10px; border-radius: 8px; border: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div id="bar">
    <div id="st">Handy aufs Lenkrad richten (quer oder hochkant – beides geht). Dann „Kamera starten“. Das Bild oben landet genau so im Video, im echten Format.</div>
    <input id="code" placeholder="CODE" maxlength="6" autocomplete="off">
    <button id="go">📷 Kamera starten</button>
    <button id="rot" class="sec">↻ Drehen</button>
    <button id="flip" class="sec">🔄 Kamera</button>
  </div>
</div>
<video id="v" playsinline autoplay muted></video>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Handy als Lenkrad-Kamera für Kampfzone. Das Kamerabild wird hier auf eine Leinwand gezeichnet (gerade, im richtigen
// Seitenverhältnis, auf Wunsch gedreht) und diese Leinwand geschickt – so kommt es am PC nie verzerrt oder gekippt an.
const PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
const $ = id => document.getElementById(id), st = (t, c) => { $('st').className = c || ''; $('st').innerHTML = t; };
const q = new URLSearchParams(location.search); if (q.get('c')) $('code').value = q.get('c').toUpperCase();
const v = $('v'), cv = $('cv'), g = cv.getContext('2d');
let cam = null, facing = 'environment', rot = 0, peer = null, call = null, out = null, loop = 0;
try { rot = +localStorage.getItem('kzcam_rot') || 0; } catch (e) {}
// Kamerabild → Leinwand im ECHTEN Format der Kamera (nichts gestaucht, nichts abgeschnitten), längste Seite max. 1280 px
function draw() {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (vw && vh) {
    const side = rot % 180 !== 0, iw = side ? vh : vw, ih = side ? vw : vh;   // Bildgröße nach dem Drehen
    const s = Math.min(1, 1280 / Math.max(iw, ih)), W = Math.round(iw * s / 2) * 2, H = Math.round(ih * s / 2) * 2;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    g.save(); g.translate(W / 2, H / 2); g.rotate(rot * Math.PI / 180);
    g.drawImage(v, -vw * s / 2, -vh * s / 2, vw * s, vh * s);
    g.restore();
  }
  loop = requestAnimationFrame(draw);
}
async function camera() {
  if (cam) cam.getTracks().forEach(t => t.stop());
  cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
  v.srcObject = cam; await v.play().catch(() => {});
  if (!loop) draw();
  if (!out) out = cv.captureStream(30);
}
function connect() {
  const code = $('code').value.trim().toUpperCase();
  if (!code) { st('Bitte den Code vom PC eingeben', 'bad'); return; }
  if (call) try { call.close(); } catch (e) {}
  const go = () => {
    st('Verbinde mit dem PC …');
    call = peer.call('kz-cam-' + code, out);
    if (!call) { st('Verbindung fehlgeschlagen – Code richtig?', 'bad'); return; }
    let ok = false;
    const t = setInterval(() => {
      const pc = call.peerConnection;
      if (pc && (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed')) { ok = true; clearInterval(t); st('✅ Mit dem PC verbunden. Bild schief? „↻ Drehen“ antippen. Bildschirm bleibt an.', 'ok'); }
      if (pc && (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected')) { clearInterval(t); st('❌ Verbindung abgebrochen – Handy und PC im selben WLAN? Nochmal „Kamera starten“.', 'bad'); }
    }, 500);
    setTimeout(() => { if (!ok) { clearInterval(t); st('❌ Keine Verbindung – ist am PC das Fenster „Lenkrad-Kamera“ offen und der Code richtig?', 'bad'); } }, 20000);
    call.on('close', () => st('Verbindung beendet – zum Neuverbinden „Kamera starten“ drücken.'));
  };
  if (peer && peer.open) go();
  else { if (peer) try { peer.destroy(); } catch (e) {} peer = new Peer(PEER_OPTS); peer.on('open', go); peer.on('error', e => st('❌ Fehler: ' + (e.type || e.message) + ' – Code richtig? PC-Fenster offen?', 'bad')); }
}
$('go').onclick = async () => {
  try { await camera(); } catch (e) { st('❌ Kamera nicht erlaubt – in den Einstellungen für Safari die Kamera erlauben und neu laden.', 'bad'); return; }
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  connect();
};
$('rot').onclick = () => { rot = (rot + 90) % 360; try { localStorage.setItem('kzcam_rot', rot); } catch (e) {} };
$('flip').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; try { await camera(); } catch (e) {} };
</script>
</body>
</html>
